name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-full
            os: windows-latest
            arch: x64
            tiny: false
            python: python
          - name: windows-x64-tiny
            os: windows-latest
            arch: x64
            tiny: true
            python: python
          - name: windows-x86-full
            os: windows-latest
            arch: Win32
            tiny: false
            python: python
          - name: ubuntu-x64-full
            os: ubuntu-latest
            arch: 64
            tiny: false
            python: python3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Code generation (scripts/generate_code.py) requires ply.
      - name: Install Python dependencies
        shell: bash
        run: ${{ matrix.python }} -m pip install ply

      - name: Configure CMake (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: powershell
        run: |
          cmake -S . -B build -A ${{ matrix.arch }} `
            -DSAMPGDK_BUILD_DOCS=OFF `
            -DSAMPGDK_BUILD_PLUGINS=ON `
            -DSAMPGDK_TINY=${{ matrix.tiny }}

      # Example plugins are Windows-focused (link against .def exports); the
      # Linux job covers the library build instead.
      - name: Configure CMake (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSAMPGDK_ARCH=${{ matrix.arch }} \
            -DSAMPGDK_BUILD_DOCS=OFF \
            -DSAMPGDK_BUILD_PLUGINS=OFF \
            -DSAMPGDK_TINY=${{ matrix.tiny }}

      - name: Build
        shell: bash
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Verify artifacts (Windows full)
        if: startsWith(matrix.os, 'windows') && !matrix.tiny
        shell: bash
        run: |
          test -f build/RelWithDebInfo/sampgdk5.dll
          # plugins built as compile smoke-test
          test -f build/plugins/helloworld/RelWithDebInfo/helloworld.dll
          test -f build/plugins/omp_example/RelWithDebInfo/omp_example.dll

      - name: Verify artifacts (Windows tiny)
        if: startsWith(matrix.os, 'windows') && matrix.tiny
        shell: bash
        run: |
          test -f build/RelWithDebInfo/sampgdk5.dll
          # ufs only uses the interop API and is built as a smoke test.
          test -f build/plugins/ufs/RelWithDebInfo/ufs.dll

      - name: Verify artifacts (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          # the shared library built against the POSIX mprotect path
          test -f build/libsampgdk.so

  # The optional single-file amalgamation is generated and published as an
  # artifact (full and tiny variants). It deliberately does not bundle Zydis
  # (hook.c keeps its real #include <Zydis/Zydis.h>), so the artifact is a
  # compact source pair that consumers combine with their own Zydis.
  amalgamation:
    name: amalgamation-${{ matrix.tiny && 'tiny' || 'full' }}
    runs-on: windows-latest
    strategy:
      matrix:
        tiny: [true, false]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Code generation (scripts/generate_code.py) requires ply.
      - name: Install Python dependencies
        run: python -m pip install ply

      - name: Configure CMake
        shell: powershell
        run: |
          cmake -S . -B build -A x64 `
            -DSAMPGDK_BUILD_DOCS=OFF `
            -DSAMPGDK_BUILD_PLUGINS=OFF `
            -DSAMPGDK_BUILD_AMALGAMATION=ON `
            -DSAMPGDK_TINY=${{ matrix.tiny }}

      # Build first so the IDL codegen generates the a_*/omp_* headers the
      # amalgamation folds in.
      - name: Build (codegen)
        shell: bash
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Build amalgamation
        shell: bash
        run: cmake --build build --target sampgdk_amalgamate --config RelWithDebInfo

      - name: Verify amalgamation excludes Zydis implementation
        shell: bash
        run: |
          test -f build/lib/sampgdk/sampgdk.c
          test -f build/lib/sampgdk/sampgdk.h
          grep -q "#include <Zydis/Zydis.h>" build/lib/sampgdk/sampgdk.c
          if grep -q "zydis_decoder_tree_root" build/lib/sampgdk/sampgdk.c; then
            echo "amalgamation unexpectedly contains Zydis internals"
            exit 1
          fi

      # The tiny amalgamation must not contain IDL native implementations
      # (e.g. sampgdk_CreatePlayer), only callback machinery.
      - name: Verify tiny amalgamation has no IDL native impls
        if: matrix.tiny
        shell: bash
        run: |
          if grep -q "sampgdk_CreatePlayer" build/lib/sampgdk/sampgdk.c; then
            echo "tiny amalgamation unexpectedly contains a native impl"
            exit 1
          fi

      - name: Upload amalgamation
        uses: actions/upload-artifact@v7
        with:
          name: sampgdk-amalgamation-${{ matrix.tiny && 'tiny' || 'full' }}
          path: |
            build/lib/sampgdk/sampgdk.c
            build/lib/sampgdk/sampgdk.h
