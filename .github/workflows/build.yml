name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-full
            os: windows-latest
            arch: x64
            tiny: false
            python: python
          - name: windows-x64-tiny
            os: windows-latest
            arch: x64
            tiny: true
            python: python
          - name: windows-x86-full
            os: windows-latest
            arch: Win32
            tiny: false
            python: python
          - name: ubuntu-x64-full
            os: ubuntu-latest
            arch: 64
            tiny: false
            python: python3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Code generation (scripts/generate_code.py) requires ply.
      - name: Install Python dependencies
        shell: bash
        run: ${{ matrix.python }} -m pip install ply

      - name: Configure CMake (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: powershell
        run: |
          cmake -S . -B build -A ${{ matrix.arch }} `
            -DSAMPGDK_BUILD_DOCS=OFF `
            -DSAMPGDK_BUILD_PLUGINS=ON `
            -DSAMPGDK_TINY=${{ matrix.tiny }}

      # Example plugins are Windows-focused (link against .def exports); the
      # Linux job covers the library build instead.
      - name: Configure CMake (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSAMPGDK_ARCH=${{ matrix.arch }} \
            -DSAMPGDK_BUILD_DOCS=OFF \
            -DSAMPGDK_BUILD_PLUGINS=OFF \
            -DSAMPGDK_TINY=${{ matrix.tiny }}

      - name: Build
        shell: bash
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Verify artifacts (Windows full)
        if: startsWith(matrix.os, 'windows') && !matrix.tiny
        shell: bash
        run: |
          test -f build/RelWithDebInfo/sampgdk5.dll
          # plugins built as compile smoke-test
          test -f build/plugins/helloworld/RelWithDebInfo/helloworld.dll
          test -f build/plugins/omp_example/RelWithDebInfo/omp_example.dll

      - name: Verify artifacts (Windows tiny)
        if: startsWith(matrix.os, 'windows') && matrix.tiny
        shell: bash
        run: |
          test -f build/RelWithDebInfo/sampgdk5.dll
          # ufs only uses the interop API and is built as a smoke test.
          test -f build/plugins/ufs/RelWithDebInfo/ufs.dll

      - name: Verify artifacts (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          # the shared library built against the POSIX mprotect path
          test -f build/libsampgdk.so
